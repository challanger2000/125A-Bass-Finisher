name: Build Windows VST3

on:
  workflow_dispatch:
  push:
    branches:
      - v1.0.0-engineering
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - "tests/**"
      - "resource/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build plugin and DSP QA
        run: cmake --build build --config Release --target BassFinisher BassFinisherDSPContractTests BassFinisherToneMatchTests BassFinisherAutomationMathTests BassFinisherBypassCrossfadeTests BassFinisherStateV1Tests BassFinisherProcessorContractTests BassFinisherRealtimeAllocationTests BassFinisherToneMatchQualityTests BassFinisherControllerContractTests --parallel

      - name: Run DSP QA
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Stage VST3 bundle
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Recurse -Directory -Filter "125A-Bass-Finisher-V1.vst3" | Select-Object -First 1
          if (-not $plugin) { throw "125A-Bass-Finisher-V1.vst3 bundle not found" }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path $plugin.FullName -Destination artifact -Recurse -Force
          if (-not (Test-Path "artifact\125A-Bass-Finisher-V1.vst3\Contents")) {
            throw "Staged VST3 bundle is incomplete"
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Bass-Finisher-V1-Windows-VST3
          path: artifact
